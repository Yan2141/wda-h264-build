Đưa 2 thư mục/file sau lên repo đó (giữ đúng cấu trúc):
Thư mục ios-h264-server/ (copy nguyên từ ios-h264-server, gồm IFarmH264Server.h, IFarmH264Server.m, entitlements.plist).
File .github/workflows/build-wda-h264.yml (copy từ build-wda-h264.yml).
Bấm chạy build:
Trên GitHub vào tab Actions → chọn Build WDA H264 Test IPA → bấm Run workflow (mặc định tag v11.2.0).
Tải .ipa và cài thử lên 1 iPhone:
Đợi ~2–3 phút chạy xong, kéo xuống mục Artifacts tải về wda-h264-test-ipa (wda-h264-test.ipa).
Cài file wda-h264-test.ipa qua TrollStore lên 1 iPhone thử nghiệm, rồi cắm vào iFarm kiểm tra xem Electron có lên hình H.264 qua WebCodecs và vẫn tap/vuốt bình thường không.
hướng dẫn upload

Bạn có thể chọn 1 trong 2 cách sau để đưa lên GitHub:

Cách 1: Upload trực tiếp trên trình duyệt (Không cần lệnh Git)
Vào GitHub → bấm New repository → đặt tên (ví dụ wda-h264-build), chọn Private → tích Add a README file → bấm Create repository.
Tạo file workflow:
Trong repo vừa tạo, bấm Add file → Create new file.
Ở ô tên file, gõ chính xác: .github/workflows/build-wda-h264.yml (GitHub tự tạo thư mục .github/workflows/).
Mở file build-wda-h264.yml bằng Notepad, copy toàn bộ nội dung dán vào → bấm Commit changes.
Upload thư mục ios-h264-server:
Quay lại trang gốc của repo → bấm Add file → Upload files.
Kéo thả cả thư mục ios-h264-server (hoặc mở thư mục, chọn 3 file IFarmH264Server.h, IFarmH264Server.m, entitlements.plist — nếu kéo từng file thì nhớ đặt đường dẫn ios-h264-server/... hoặc kéo nguyên thư mục ios-h264-server vào khung upload của trình duyệt) → bấm Commit changes.
Vào tab Actions → chọn Build WDA H264 Test IPA → bấm Run workflow.
Cách 2: Đẩy bằng Git CLI (Nhanh nếu đã cài Git trên máy)

