Sau khi push xong, vào tab Actions trên GitHub → bấm Run workflow và đợi ~2–3 phút để tải wda-h264-test.ipa ở mục Artifacts.

Bạn đang ở đúng màn hình rồi! Làm tiếp 3 bước ngắn ngay trên trang này:

Tạo file workflow:

Bấm vào ô Name your file..., gõ chính xác: .github/workflows/build-wda-h264.yml
Mở build-wda-h264.yml, copy toàn bộ dán vào khung Enter file contents here → bấm nút xanh Commit changes... (góc trên phải) → Commit changes.

Upload thư mục ios-h264-server:

Quay lại trang gốc wda-h264-build (bấm chữ wda-h264-build màu xanh hoặc tab Code).
Bấm nút + (bên phải ô nhánh main ở cột trái) → chọn Upload files.
Kéo nguyên thư mục ios-h264-server thả vào → bấm Commit changes.

Chạy build:

Bấm tab Actions trên thanh menu → chọn Build WDA H264 Test IPA → bấm Run workflow.
Đợi ~2–3 phút hoàn tất, tải file trong mục Artifacts (wda-h264-test-ipa).
name: Build WDA H264 Test IPA
on:
  workflow_dispatch:
    inputs:
      wda_tag:
        description: 'Appium WebDriverAgent tag'
        required: true
        default: 'v11.2.0'
jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Clone WebDriverAgent
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.wda_tag }}" https://github.com/appium/WebDriverAgent.git wda-src
      - name: Inject IFarmH264Server into WebDriverAgent
        run: |
          cp ios-h264-server/IFarmH264Server.h wda-src/WebDriverAgentLib/
          cp ios-h264-server/IFarmH264Server.m wda-src/WebDriverAgentLib/
          python3 - << 'PY'
          import pathlib, re
          fb = pathlib.Path('wda-src/WebDriverAgentLib/Routing/FBWebServer.m')
          txt = fb.read_text(encoding='utf-8')
          if 'IFarmH264Server.h' not in txt:
            txt = '#import "IFarmH264Server.h"\n' + txt
          if 'startWithPort:9101' not in txt:
            txt = re.sub(
              r'(\[self\.server\s+start:&error\]|\[self\s+startServing\])',
              r'[[IFarmH264Server sharedServer] startWithPort:9101 fps:15 maxWidth:540 bitrateBps:1200000];\n  \1',
              txt,
              count=1
            )
          fb.write_text(txt, encoding='utf-8')
          PY
          gem install xcodeproj --no-document
          ruby - << 'RB'
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('wda-src/WebDriverAgent.xcodeproj')
          lib_target = proj.targets.find { |t| t.name == 'WebDriverAgentLib' }
          group = proj.main_group.find_subpath('WebDriverAgentLib', true)
          h_ref = group.new_reference('IFarmH264Server.h')
